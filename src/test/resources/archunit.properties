# A rule that matches no classes passes silently instead of failing the build.
#
# This is ONLY here because the repository ships without a business module yet: rules such as
# commands_and_queries_are_standalone_records have nothing to match on day one.
#
# >>> Set this back to true as soon as the first module lands. <<<
#
# Leaving it false permanently is worse than having no rules, because a typo in a package name
# ("..domian..") turns a rule into a green test that checks nothing, and you will trust it.
archRule.failOnEmptyShould=false
