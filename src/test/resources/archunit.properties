# A rule that matches no classes must FAIL, not pass silently.
#
# This was false while the repository shipped without a business module: rules such as
# commands_and_queries_are_standalone_records had nothing to match on day one.
#
# The submission module is that first module, so this is now TRUE, and there are NO per-rule
# allowEmptyShould(true) exceptions left in ArchitectureRulesTest: the two controller rules
# carried one while adapters/web/ did not exist yet, and both were removed once the controllers
# landed. Every rule in that class now matches at least one class.
#
# Leaving this false would be worse than having no rules at all, because a typo in a package name
# ("..domian..") turns a rule into a green test that checks nothing, and you will trust it.
#
# Note the one leak this setting cannot protect you from: ArchUnit reads bytecode, and javac
# inlines compile-time constants, so a cross-package dependency that is only a `static final`
# primitive or String is invisible to every rule here. See the comment above the purity rule.
archRule.failOnEmptyShould=true
