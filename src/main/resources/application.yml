spring:
  application:
    name: service-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/service}
    username: ${DATABASE_USERNAME:service}
    # No default: a missing password must fail startup, not fall back to a known credential.
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  outbox:
    relay:
      batch-size: 100
      poll-interval: PT1S

logging:
  level:
    org.springframework.jdbc.core: INFO

server:
  error:
    include-message: never
    include-stacktrace: never
