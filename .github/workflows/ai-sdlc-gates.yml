name: AI SDLC gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Checkstyle runs in `validate`, so a forbidden import or a `throw new` fails here
      # before anything compiles.
      - name: Full verify
        run: ./mvnw -B --no-transfer-progress verify

  write-lock:
    name: Phase write lock
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # The separation of duties between agents is only real if something checks it.
      # Label the PR with the phase it belongs to; the matching boundary is then enforced.
      - name: Developer phase — tests and docs must be untouched
        if: contains(github.event.pull_request.labels.*.name, 'phase:green')
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash scripts/check-write-lock.sh green

      - name: QA phase — production code must be untouched
        if: contains(github.event.pull_request.labels.*.name, 'phase:qa')
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash scripts/check-write-lock.sh qa

      # In the RED phase a passing build is the failure: it means the tests are satisfied
      # by the null-returning stubs and assert nothing.
      - name: Red phase — contracts compile, tests fail
        if: contains(github.event.pull_request.labels.*.name, 'phase:red')
        run: bash scripts/check-write-lock.sh red
